<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="東京自駕">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a2332">
<meta name="description" content="Tracy 一家東京自駕遊 2026.10.14–10.22">
<title>東京自駕遊｜10.14–10.22</title>
<style>body{margin:0;background:#0f1419;color:#f0ebe3;font:18px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}.boot{padding:48px 24px;text-align:center}.boot p{color:#a8b0bc}</style>
</head>
<body>
<div class="boot" id="boot"><p>載入東京自駕行程…</p></div>
<script>
(async function(){
  try {
    var base = location.href.replace(/[^/]*$/, "");
    var parts = await Promise.all([1,2,3,4].map(function(i){
      return fetch(base + "c" + i + ".txt").then(function(r){
        if (!r.ok) throw new Error("c" + i + " HTTP " + r.status);
        return r.text();
      });
    }));
    var b64 = parts.map(function(t){ return t.trim(); }).join("");
    var bin = Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); });
    var stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
    var html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById("boot").innerHTML = "<p>無法載入。請用預覽網址開啟（iOS 16.4+ Safari／Chrome）。</p><p style=\"font-size:14px;color:#888\">" + e + "</p>";
  }
})();
</script>
</body>
</html>
