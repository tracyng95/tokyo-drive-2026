function toast(t){const el=document.getElementById("toast");el.textContent=t;el.style.display="block";setTimeout(()=>el.style.display="none",1400)}
function copyText(t){const text=String(t||"");if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast("已複製")).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;left:0;top:0;opacity:0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");toast("已複製");}catch(e){toast("請長按複製");}document.body.removeChild(ta);}
function placeCard(p){if(!p)return"";const dest=p.q||p.addr;const tel=p.tel?`<a class="btn tel" href="tel:${p.tel.replace(/-/g,"")}">打電話 ${p.tel}</a>`:"";const map=p.map?`<div class="kv"><b>Mapcode</b><span class="mono">${p.map}</span></div>`:"";return `<div class="place"><div class="name">${p.name}</div><div class="kv"><b>地址</b><span>${p.addr}</span>${p.tel?`<b>電話</b><span>${p.tel}</span>`:""}</div>${map}${p.note?`<p class="meta" style="margin:8px 0 0">${p.note}</p>`:""}<div class="row"><a class="btn nav" href="${gdest(dest)}">Google 導航</a><a class="btn map" href="${gq(dest)}">開地圖睇位置</a>${p.map?`<button type="button" class="btn copy" data-copy="${p.map}">複製 Mapcode</button>`:""}<button type="button" class="btn copy" data-copy="${p.addr}">複製地址</button>${tel}</div></div>`;}
function legCard(leg){return `<div class="card"><span class="chip">${leg.day}</span><h2>${leg.title}</h2><p class="meta">${leg.min} 分 · ${leg.km} km · ${leg.toll}</p><div class="leg"><div class="t">路線</div>${leg.route}</div><div class="leg"><div class="t">交流道</div>${leg.ic}</div>${leg.rest?`<div class="leg"><div class="t">休息</div>${leg.rest}</div>`:""}<div class="alert">${leg.warn}</div><div class="row"><a class="btn nav" href="${gd(leg.from.q||leg.from.addr,leg.to.q||leg.to.addr)}">由起點導航到終點</a></div><h3>起點</h3>${placeCard(leg.from)}<h3>終點</h3>${placeCard(leg.to)}</div>`;}
function dayCard(d){return `<div class="card" id="day-${d.date.replace("/","")}"><span class="chip">${d.date}（${d.wd}）</span><h2>${d.title}</h2>${d.stay?`<p class="meta">當晚：${d.stay.name}</p>`:"<p class='meta'>回港日</p>"}<h3>時間軸</h3>${d.plan.map(x=>`<div class="kv"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}${d.legs.length?`<h3>今日車程</h3>`+d.legs.map(id=>legCard(legs.find(l=>l.id===id))).join(""):`<div class="okbox">今日唔使開車。</div>`}${d.stay?`<h3>今晚酒店</h3>`+placeCard(d.stay):""}${d.spots.length?`<h3>景點</h3>`+d.spots.map(placeCard).join(""):""}${d.eats.length?`<h3>飲食</h3>`+d.eats.map(placeCard).join(""):""}</div>`;}

tabBox.innerHTML=`<button class="on" data-jump="today">總覽</button>`+days.map(d=>`<button data-jump="${d.date}">${d.date}</button>`).join("");
tabBox.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tabBox.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");const j=b.dataset.jump;if(j==="today"){show("today");return;}show("days");const el=document.getElementById("day-"+j.replace("/",""));if(el)el.scrollIntoView({behavior:"smooth",block:"start"});});
function show(name){document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==="view-"+name));document.querySelectorAll("nav.bottom button").forEach(b=>b.classList.toggle("on",b.dataset.view===name));window.scrollTo(0,0);}
document.querySelector("nav.bottom").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;show(b.dataset.view);});
document.addEventListener("click",e=>{const c=e.target.closest("[data-copy]");if(c){e.preventDefault();copyText(c.getAttribute("data-copy"));}});
renderToday();renderDays();renderNav();renderStay();renderKit();
