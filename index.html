<style>
:root{
  --bg:#0B1220; --card:#152238; --card2:#1C2D48; --line:#2A3D5C;

  --text:#F4F1EA; --muted:#9AA8BC; --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;line-height:1.45}
body{padding-bottom:88px}
header.app{
  position:sticky;top:0;z-index:20;background:linear-gradient(#0B1220,#0B1220ee);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)
}
header.app h1{margin:0;font-size:18px;letter-spacing:.04em}
header.app p{margin:2px 0 0;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:8px;overflow:auto;padding:10px 16px 4px;position:sticky;top:62px;z-index:19;background:var(--bg)}
.tabs button{flex:0 0 auto;border:0;border-radius:999px;padding:8px 14px;background:var(--card);color:var(--text);font-size:13px}
.tabs button.on{background:#2A5A93;color:#fff}
section{display:none;padding:8px 16px 24px}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card h2{margin:0 0 6px;font-size:17px}
.card h3{margin:14px 0 6px;font-size:15px;color:var(--gold)}
.meta{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 12px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:600;border:0}
.btn.nav{background:#1F6FEB;color:#fff;flex:1}
.btn.copy{background:var(--card2);color:var(--text);flex:1}
.btn.tel{background:#245C45;color:#fff}
.btn.warn{background:#6B3A1F;color:#fff}
.chip{display:inline-block;background:#22344F;color:var(--navy);border-radius:8px;padding:3px 8px;font-size:12px;margin:0 6px 6px 0}
.place{background:var(--card2);border-radius:14px;padding:12px;margin-top:10px}
.place .name{font-weight:700;font-size:16px}
.kv{display:grid;grid-template-columns:86px 1fr;gap:4px 8px;font-size:13px;margin-top:8px}
.kv b{color:var(--muted);font-weight:500}
.leg{border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin:10px 0}
.leg .t{font-weight:700}
code, .mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.02em}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:999px;display:none;z-index:50;font-size:14px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#101A2C;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:30}
nav.bottom button{background:none;border:0;color:var(--muted);font-size:11px}
nav.bottom button.on{color:var(--gold)}
nav.bottom span{display:block;font-size:16px}
.alert{background:#3A2416;border:1px solid #8A5A32;color:#F8D9B0;border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.okbox{background:#163328;border:1px solid #2F6B52;color:#CFF5E4;border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
hr.s{border:0;border-top:1px solid var(--line);margin:14px 0}
.search{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:#fff;font-size:16px;margin:8px 0 12px}
</style>
</head>

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.style.display="block";setTimeout(()=>el.style.display="none",1400)}
function copy(t){navigator.clipboard.writeText(t).then(()=>toast("已複製")).catch(()=>toast("請長按複製"))}
function placeCard(p){
  if(!p) return "";
  const tel = p.tel ? `<a class="btn tel" href="tel:${p.tel.replace(/-/g,"")}">打電話 ${p.tel}</a>` : "";
  const map = p.map ? `<div class="kv"><b>Mapcode</b><span class="mono">${p.map} <a href="#" onclick="copy('${p.map}');return false">複製</a></span></div>` : "";
  return `<div class="place"><div class="name">${p.name}</div><div class="kv"><b>地址</b><span>${p.addr}</span>${p.tel?`<b>電話</b><span>${p.tel}</span>`:""}</div>${map}${p.note?`<p class="meta" style="margin:8px 0 0">${p.note}</p>`:""}<div class="row"><a class="btn nav" href="${gdest(p.q||p.addr)}" target="_blank" rel="noopener">Google 導航</a><a class="btn copy" href="${gq(p.q||p.addr)}" target="_blank" rel="noopener">開地圖</a><button class="btn copy" onclick="copy(${JSON.stringify(p.addr)})">複製地址</button>${tel}</div></div>`;
}
function legCard(leg){
  return `<div class="card"><span class="chip">${leg.day}</span><h2>${leg.title}</h2><p class="meta">${leg.min} 分鐘 · ${leg.km} km · 過路費 ${leg.toll}</p><div class="leg"><div class="t">路線</div>${leg.route}</div><div class="leg"><div class="t">交流道</div>${leg.ic}</div>${leg.rest?`<div class="leg"><div class="t">休息</div>${leg.rest}</div>`:""}<div class="alert">${leg.warn}</div><div class="row"><a class="btn nav" href="${gd(leg.from.q||leg.from.addr, leg.to.q||leg.to.addr)}" target="_blank" rel="noopener">由起點導航到終點</a></div><h3>起點</h3>${placeCard(leg.from)}<h3>終點</h3>${placeCard(leg.to)}</div>`;
}
function dayCard(d){
  return `<div class="card" id="day-${d.date.replace("/","")}"><span class="chip">${d.date}（${d.wd}）</span><h2>${d.title}</h2>${d.stay?`<p class="meta">當晚：${d.stay.name}</p>`:"<p class='meta'>回港日</p>"}<h3>時間軸</h3>${d.plan.map(x=>`<div class="kv"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}${d.legs.length?`<h3>今日車程</h3>`+d.legs.map(id=>legCard(legs.find(l=>l.id===id))).join(""):`<div class="okbox">今日唔使開車。</div>`}${d.stay?`<h3>今晚酒店</h3>`+placeCard(d.stay):""}${d.spots.length?`<h3>景點</h3>`+d.spots.map(placeCard).join(""):""}${d.eats.length?`<h3>飲食</h3>`+d.eats.map(placeCard).join(""):""}</div>`;
}
function todayIndex(){
  const now=new Date();
  const map={"2026-10-14":0,"2026-10-15":1,"2026-10-16":2,"2026-10-17":3,"2026-10-18":4,"2026-10-19":5,"2026-10-20":6,"2026-10-21":7,"2026-10-22":8};
  const key=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  return map[key]!=null?map[key]:0;
}
function renderToday(){const d=days[todayIndex()];document.getElementById("view-today").innerHTML=`<div class="okbox">未到旅行日時預設顯示 10/14。底欄「日程」睇全部。</div>`+dayCard(d);}
function renderDays(){document.getElementById("view-days").innerHTML=days.map(dayCard).join("");}
function renderNav(){document.getElementById("view-nav").innerHTML=`<div class="alert">藍色揭開 Google Maps。車機輸入 Mapcode 或日文地址。</div>`+legs.map(legCard).join("");}
function renderStay(){document.getElementById("view-stay").innerHTML=[P.shizuku,P.clad,P.blisstia,P.atami,P.gracery,P.nissanNrt,P.nissanShin].map(p=>`<div class="card">${placeCard(p)}</div>`).join("");}
function renderKit(){document.getElementById("view-kit").innerHTML=`<div class="card"><h2>司機必備</h2><p>國際駕駛許可證 + 香港驗照正本 + 租車確認 + 護照 + ETC。</p><div class="alert">日本左駕。還車前看契約係咪要滿油。</div><h3>緊急</h3><div class="row"><a class="btn warn" href="tel:110">警察 110</a><a class="btn warn" href="tel:119">救護 119</a></div></div><div class="card"><h2>點對點車程</h2><div class="kv"><b>14號</b><span>成田→山中湖 2.5–3小時</span><b>16號</b><span>山中湖→御殿場 40–55分</span><b>17號</b><span>御殿場→仙石原 20–35分</span><b>18號</b><span>仙石原→熱海 70–100分</span><b>19號</b><span>熱海→鎌倉 90–110分；鎌倉→新宿 60–90分</span></div></div><div class="card"><h2>熱海停車場限制</h2><p>全寬≤2,050mm、全高≤2,000mm、重量≤2,500kg。一晚¥1,000。</p><a class="btn tel" href="tel:0557815489">酒店確認車位 0557-81-5489</a></div><div class="card"><h2>加到主畫面</h2><p>Safari 分享 → 加至主畫面。</p></div><div class="card"><h2>航班</h2><div class="kv"><b>去程</b><span>10/14 UO848 09:15 → 14:45</span><b>回程</b><span>10/22 UO871 17:05 → 21:00</span></div>${placeCard(P.nrtT2)}</div>`;}
const tabBox=document.getElementById("dayTabs");
tabBox.innerHTML=`<button class="on" data-jump="today">總覽</button>`+days.map(d=>`<button data-jump="${d.date}">${d.date}</button>`).join("");
tabBox.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tabBox.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");const j=b.dataset.jump;if(j==="today"){show("today");return;}show("days");const el=document.getElementById("day-"+j.replace("/",""));if(el)el.scrollIntoView({behavior:"smooth",block:"start"});});
function show(name){document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==="view-"+name));document.querySelectorAll("nav.bottom button").forEach(b=>b.classList.toggle("on",b.dataset.view===name));window.scrollTo(0,0);}
document.querySelector("nav.bottom").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;show(b.dataset.view);});
renderToday();renderDays();renderNav();renderStay();renderKit();
</script>
</body>
</html>
